<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ajouter une adresse</title>
<style>
  :root { --bg: #faf7f2; --ink: #2b241c; --accent: #c1502e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid #ddd3c2; border-radius: 10px; background: #fff;
  }
  textarea { resize: vertical; min-height: 50px; }
  button {
    width: 100%; margin-top: 24px; padding: 14px;
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  #msg { margin-top: 16px; font-size: 14px; text-align: center; }
  .ok { color: #3d7a5c; }
  .err { color: #c1502e; }
</style>
</head>
<body>

<h1>🍽️ Ajouter une adresse</h1>
<div id="autoStatus" style="font-size:13px;color:#8a8071;"></div>

<label for="nom">Nom du lieu</label>
<input id="nom" type="text" placeholder="Ex : Le Baratin" />

<label for="type">Type</label>
<select id="type">
  <option value="resto">🍽️ Resto</option>
  <option value="bar">🍷 Bar</option>
  <option value="expo">🖼️ Expo</option>
  <option value="rando">🥾 Rando</option>
  <option value="visite">🏛️ Visite</option>
</select>

<label for="source">Source</label>
<select id="source">
  <option value="Google Maps">Google Maps</option>
  <option value="Instagram">Instagram</option>
  <option value="Conseil d'un ami">Conseil d'un ami</option>
  <option value="Autre">Autre</option>
</select>

<label for="adresse">Adresse (vérifie/complète si besoin)</label>
<input id="adresse" type="text" placeholder="Ex : 3 Rue Jouye-Rouve" />

<label for="ville">Ville</label>
<input id="ville" type="text" placeholder="Ex : Paris" />

<label for="lien">Lien (rempli automatiquement)</label>
<textarea id="lien" placeholder="Colle ici le lien si besoin"></textarea>

<button id="btnAdd">Ajouter à la carte</button>
<div id="msg"></div>

<script>
// ⚠️ Mêmes valeurs que dans index.html et apps-script.gs
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxS_Aupx0m4-FIfrcZVrWkcNMKO9RRFNk4JMjuVY_zDoG-iaoPlgywqAm7MVtwrxM9o/exec";
const APPS_SCRIPT_TOKEN = "bouffster-x7k2m9";

// Pré-remplissage depuis le lien partagé (?lien=...) et détection de la source
const params = new URLSearchParams(window.location.search);
const lienPartage = params.get('lien') || params.get('texte') || "";
document.getElementById('lien').value = lienPartage;

let autoLat = "", autoLng = "";

if (lienPartage.toLowerCase().includes('instagram')) {
  document.getElementById('source').value = "Instagram";
} else if (lienPartage.toLowerCase().includes('google') || lienPartage.toLowerCase().includes('maps.app.goo.gl')) {
  document.getElementById('source').value = "Google Maps";
}

async function autoResolve() {
  if (!lienPartage) return;
  const statusEl = document.getElementById('autoStatus');
  statusEl.textContent = "🔍 Recherche automatique des informations...";
  try {
    const url = `${APPS_SCRIPT_URL}?action=resolveLink&token=${encodeURIComponent(APPS_SCRIPT_TOKEN)}&lien=${encodeURIComponent(lienPartage)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.nom) document.getElementById('nom').value = data.nom;
    if (data.adresse) document.getElementById('adresse').value = data.adresse;
    if (data.ville) document.getElementById('ville').value = data.ville;
    autoLat = data.latitude || "";
    autoLng = data.longitude || "";
    statusEl.textContent = (data.nom || data.adresse)
      ? "✅ Informations trouvées automatiquement — vérifie avant de valider."
      : "ℹ️ Rien trouvé automatiquement, complète à la main.";
  } catch (e) {
    statusEl.textContent = "ℹ️ Auto-remplissage indisponible ici, complète à la main.";
  }
}
autoResolve();

document.getElementById('btnAdd').addEventListener('click', () => {
  const nom = document.getElementById('nom').value.trim();
  const type = document.getElementById('type').value;
  const source = document.getElementById('source').value;
  const adresse = document.getElementById('adresse').value.trim();
  const ville = document.getElementById('ville').value.trim();
  const lien = document.getElementById('lien').value.trim();
  const msgEl = document.getElementById('msg');

  if (!nom) {
    msgEl.textContent = "Merci d'indiquer un nom.";
    msgEl.className = "err";
    return;
  }

  const btn = document.getElementById('btnAdd');
  btn.disabled = true;
  btn.textContent = "Ajout en cours...";

  const url = `${APPS_SCRIPT_URL}?action=addPlace&token=${encodeURIComponent(APPS_SCRIPT_TOKEN)}`
    + `&nom=${encodeURIComponent(nom)}`
    + `&type=${encodeURIComponent(type)}`
    + `&source=${encodeURIComponent(source)}`
    + `&adresse=${encodeURIComponent(adresse)}`
    + `&ville=${encodeURIComponent(ville)}`
    + `&latitude=${encodeURIComponent(autoLat)}`
    + `&longitude=${encodeURIComponent(autoLng)}`
    + `&lien=${encodeURIComponent(lien)}`;

  fetch(url, { mode: "no-cors" })
    .then(() => {
      msgEl.textContent = "✅ Ajouté ! Tu peux fermer cette page.";
      msgEl.className = "ok";
      btn.textContent = "Ajouté ✓";
    })
    .catch(() => {
      msgEl.textContent = "❌ Erreur réseau, réessaie.";
      msgEl.className = "err";
      btn.disabled = false;
      btn.textContent = "Ajouter à la carte";
    });
});
</script>
</body>
</html>
