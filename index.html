<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ma carte des bonnes adresses</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root {
    --bg: #faf7f2;
    --ink: #2b241c;
    --accent: #c1502e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #e8e0d4;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    z-index: 1000;
  }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  header input, header select {
    padding: 7px 10px;
    border: 1px solid #ddd3c2;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  header input { flex: 1; min-width: 140px; }

  #status { font-size: 12px; color: #8a8071; padding: 4px 16px; background: #fff; }
  #locationBar { background: #fbf4ec; border-bottom: 1px solid #e8e0d4; padding: 8px 16px; }
  #locationBar button {
    padding: 7px 12px;
    border: 1px solid #ddd3c2;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  #locationBar button:hover { background: #f1e9dc; }
  #locationInput { flex: 1; min-width: 140px; }

  #map { flex: 1; }

  .leaflet-popup-content { font-size: 14px; line-height: 1.4; }
  .popup-title { font-weight: 700; margin-bottom: 2px; }
  .popup-cat {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
    background: #f1e9dc;
    color: #6b5b3f;
    margin-bottom: 6px;
  }
  .popup-notes { margin-top: 4px; }
  .popup-source-text { margin-top: 4px; font-size: 12px; color: #8a8071; }
  .popup-link a { color: var(--accent); font-size: 13px; }
  .popup-teste {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #eee;
    font-size: 13px;
    cursor: pointer;
  }
  .popup-teste input { width: 16px; height: 16px; cursor: pointer; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>🍽️ Mes bonnes adresses</h1>
    <select id="filterType"><option value="">Tous les types</option></select>
    <select id="filterSource"><option value="">Toutes sources</option></select>
    <select id="filterTeste">
      <option value="">Testé & à tester</option>
      <option value="oui">Déjà testés</option>
      <option value="non">À tester</option>
    </select>
    <input id="search" type="text" placeholder="Rechercher un nom, une ville..." />
  </header>
  <header id="locationBar">
    <button id="btnNearMe" type="button">📍 Autour de moi</button>
    <input id="locationInput" type="text" placeholder="...ou tape une adresse / rue" />
    <button id="btnLocationSearch" type="button">🔍 Chercher</button>
    <select id="radiusSelect">
      <option value="0.5">500 m</option>
      <option value="1" selected>1 km</option>
      <option value="2">2 km</option>
      <option value="5">5 km</option>
    </select>
    <button id="btnClearLocation" type="button" style="display:none;">✕ Effacer</button>
  </header>
  <div id="status">Chargement des adresses…</div>
  <div id="map"></div>
</div>

<script>
/* ============================================================
   CONFIG — à modifier une fois ton Google Sheet créé
   ============================================================
   1. Crée un Google Sheet avec ces colonnes en ligne 1 :
      Nom | Adresse | Ville | Latitude | Longitude | Categorie | Notes | Source
   2. Fichier > Partager > Publier sur le web > format CSV
   3. Colle l'URL générée ci-dessous.
   Latitude/Longitude peuvent être laissées vides : la carte
   géocodera automatiquement l'adresse (via OpenStreetMap) et
   gardera le résultat en mémoire locale du navigateur.
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/18gBqvatcT5b4sL7JXluhL_OyhF--jCJZ3IEXoUvMS2M/export?format=csv&gid=0";

// URL du Google Apps Script déployé, qui permet de COCHER "testé" directement
// depuis la carte (voir apps-script.gs pour le code à déployer).
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxS_Aupx0m4-FIfrcZVrWkcNMKO9RRFNk4JMjuVY_zDoG-iaoPlgywqAm7MVtwrxM9o/exec";

// Doit être identique à SECRET_TOKEN dans apps-script.gs
const APPS_SCRIPT_TOKEN = "bouffster-x7k2m9";

const DEFAULT_CENTER = [46.6, 2.4]; // France
const DEFAULT_ZOOM = 6;

// ---- Carte ----
const map = L.map('map').setView(DEFAULT_CENTER, DEFAULT_ZOOM);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
let allPlaces = [];

const TYPE_STYLE = {
  resto:  { emoji: "🍽️", color: "#c1502e" },
  bar:    { emoji: "🍷", color: "#8a5aa8" },
  expo:   { emoji: "🖼️", color: "#2e5b8a" },
  rando:  { emoji: "🥾", color: "#3d7a5c" },
  visite: { emoji: "🏛️", color: "#b8862e" }
};
const DEFAULT_STYLE = { emoji: "📍", color: "#8a8071" };

function styleFor(type) {
  const key = (type || "").trim().toLowerCase();
  return TYPE_STYLE[key] || DEFAULT_STYLE;
}

function makeIcon(type, teste) {
  const s = styleFor(type);
  const isTeste = (teste || "").trim().toLowerCase() === "oui";
  const border = isTeste ? `3px solid ${s.color}` : `2px dashed ${s.color}`;
  return L.divIcon({
    className: '',
    html: `<div style="background:#fff;width:28px;height:28px;border-radius:50%;border:${border};display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.35);">${s.emoji}</div>`,
    iconSize: [28,28],
    iconAnchor: [14,28],
    popupAnchor: [0,-26]
  });
}

// ---- Géocodage (fallback si pas de Latitude/Longitude dans le Sheet) ----
async function geocode(address) {
  const cacheKey = "geocode:" + address;
  const cached = localStorage.getItem(cacheKey);
  if (cached) return JSON.parse(cached);
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(address);
    const res = await fetch(url, { headers: { "Accept-Language": "fr" } });
    const data = await res.json();
    if (data && data[0]) {
      const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      localStorage.setItem(cacheKey, JSON.stringify(coords));
      return coords;
    }
  } catch (e) { console.warn("Géocodage échoué pour", address, e); }
  return null;
}

function renderMarkers(places) {
  markersLayer.clearLayers();
  places.forEach(p => {
    if (p.lat == null || p.lng == null) return;
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.type, p.teste) });
    const isTeste = (p.teste || "").trim().toLowerCase() === "oui";
    const checkboxId = "teste-" + p.id;
    marker.bindPopup(`
      <div class="popup-title">${p.nom || "Sans nom"}</div>
      ${p.categorie ? `<span class="popup-cat">${p.categorie}</span>` : ""}
      <div>${p.adresse || ""}${p.ville ? ", " + p.ville : ""}</div>
      ${p.notes ? `<div class="popup-notes">${p.notes}</div>` : ""}
      ${p.source ? `<div class="popup-source-text">Source : ${p.source}</div>` : ""}
      ${p.lien ? `<div class="popup-link"><a href="${p.lien}" target="_blank">Ouvrir la fiche ↗</a></div>` : ""}
      <label class="popup-teste">
        <input type="checkbox" id="${checkboxId}" ${isTeste ? "checked" : ""}
          onchange="window.handleTesteToggle('${p.id}', this.checked, this)">
        Déjà testé
      </label>
    `);
    marker.on('popupopen', () => {
      // rien de spécial ici pour l'instant, réservé si besoin d'init JS supplémentaire
    });
    markersLayer.addLayer(marker);
  });
}

function populateFilter(places) {
  const types = [...new Set(places.map(p => p.type).filter(Boolean))].sort();
  const sel = document.getElementById('filterType');
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    sel.appendChild(opt);
  });

  const sources = [...new Set(places.map(p => p.source).filter(Boolean))].sort();
  const selSource = document.getElementById('filterSource');
  sources.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    selSource.appendChild(opt);
  });
}

// ---- Distance à vol d'oiseau (formule de Haversine), en km ----
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ---- Point de référence pour "Autour de moi" / recherche de lieu ----
let refPoint = null; // { lat, lng, label }
let refCircle = null;

function drawRefCircle() {
  if (refCircle) { map.removeLayer(refCircle); refCircle = null; }
  if (!refPoint) return;
  const radiusKm = parseFloat(document.getElementById('radiusSelect').value);
  refCircle = L.circle([refPoint.lat, refPoint.lng], {
    radius: radiusKm * 1000,
    color: "#c1502e",
    weight: 1.5,
    fillOpacity: 0.06
  }).addTo(map);
  map.fitBounds(refCircle.getBounds(), { padding: [30, 30] });
}

function setRefPoint(lat, lng, label) {
  refPoint = { lat, lng, label };
  document.getElementById('btnClearLocation').style.display = "inline-block";
  drawRefCircle();
  applyFilters();
}

function clearRefPoint() {
  refPoint = null;
  if (refCircle) { map.removeLayer(refCircle); refCircle = null; }
  document.getElementById('btnClearLocation').style.display = "none";
  applyFilters();
  if (allPlaces.length) {
    const bounds = L.latLngBounds(allPlaces.map(p => [p.lat, p.lng]));
    map.fitBounds(bounds, { padding: [30, 30] });
  }
}

function applyFilters() {
  const type = document.getElementById('filterType').value;
  const source = document.getElementById('filterSource').value;
  const teste = document.getElementById('filterTeste').value;
  const q = document.getElementById('search').value.trim().toLowerCase();
  const radiusKm = parseFloat(document.getElementById('radiusSelect').value);

  const filtered = allPlaces.filter(p => {
    const matchType = !type || (p.type || "").toLowerCase() === type.toLowerCase();
    const matchSource = !source || p.source === source;
    const matchTeste = !teste || (p.teste || "").toLowerCase() === teste;
    const matchQ = !q || (p.nom + " " + p.ville + " " + p.adresse + " " + p.categorie).toLowerCase().includes(q);
    const matchDistance = !refPoint || distanceKm(refPoint.lat, refPoint.lng, p.lat, p.lng) <= radiusKm;
    return matchType && matchSource && matchTeste && matchQ && matchDistance;
  });
  renderMarkers(filtered);

  const statusEl = document.getElementById('status');
  let msg = `${filtered.length} adresse(s) affichée(s)`;
  if (refPoint) msg += ` — dans un rayon de ${radiusKm} km autour de "${refPoint.label}"`;
  statusEl.textContent = msg;
}

document.getElementById('filterType').addEventListener('change', applyFilters);
document.getElementById('filterSource').addEventListener('change', applyFilters);
document.getElementById('filterTeste').addEventListener('change', applyFilters);
document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('radiusSelect').addEventListener('change', () => {
  if (refPoint) drawRefCircle();
  applyFilters();
});

document.getElementById('btnNearMe').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert("La géolocalisation n'est pas disponible sur ce navigateur.");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => setRefPoint(pos.coords.latitude, pos.coords.longitude, "ma position"),
    err => alert("Impossible de récupérer ta position : " + err.message)
  );
});

document.getElementById('btnLocationSearch').addEventListener('click', async () => {
  const val = document.getElementById('locationInput').value.trim();
  if (!val) return;
  const geo = await geocode(val);
  if (geo) {
    setRefPoint(geo.lat, geo.lng, val);
  } else {
    alert("Lieu introuvable : " + val);
  }
});
document.getElementById('locationInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btnLocationSearch').click();
});

document.getElementById('btnClearLocation').addEventListener('click', clearRefPoint);

// Appelée quand on coche/décoche "Déjà testé" dans un popup.
// 1) Met à jour l'état local + l'icône tout de suite (retour visuel instantané)
// 2) Envoie la mise à jour au Google Sheet via Apps Script (persistant)
window.handleTesteToggle = function(id, checked, checkboxEl) {
  const newValue = checked ? "Oui" : "Non";
  const place = allPlaces.find(p => String(p.id) === String(id));
  if (place) place.teste = newValue;

  if (checkboxEl) {
    const label = checkboxEl.closest('.leaflet-popup-content');
  }

  if (APPS_SCRIPT_URL.includes("REMPLACE_MOI")) {
    console.warn("APPS_SCRIPT_URL non configuré : la case est mise à jour visuellement mais pas sauvegardée dans le Sheet.");
  } else {
    const url = `${APPS_SCRIPT_URL}?action=updateTeste&id=${encodeURIComponent(id)}&value=${encodeURIComponent(newValue)}&token=${encodeURIComponent(APPS_SCRIPT_TOKEN)}`;
    fetch(url, { mode: "no-cors" }).catch(err => console.warn("Échec de la sauvegarde :", err));
  }

  applyFilters(); // redessine les marqueurs avec le nouveau style (plein/pointillé)
};

async function load() {
  const statusEl = document.getElementById('status');

  if (SHEET_CSV_URL.includes("REMPLACE_MOI")) {
    statusEl.textContent = "⚠️ Configure d'abord le lien vers ton Google Sheet dans le code (variable SHEET_CSV_URL).";
    return;
  }

  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: async (results) => {
      const rows = results.data;
      console.log("[carte] Colonnes détectées dans le CSV :", results.meta.fields);
      statusEl.textContent = `Chargement de ${rows.length} adresse(s)…`;

      const places = [];
      for (const row of rows) {
        const nom = row.Nom || row.nom;
        const adresse = row.Adresse || row.adresse;
        const ville = row.Ville || row.ville;
        let lat = parseFloat(row.Latitude || row.latitude);
        let lng = parseFloat(row.Longitude || row.longitude);

        if ((isNaN(lat) || isNaN(lng))) {
          if (adresse) {
            const full = `${adresse}, ${ville || ''}`;
            const geo = await geocode(full);
            if (geo) {
              lat = geo.lat; lng = geo.lng;
            } else {
              console.warn(`[carte] Géocodage sans résultat pour "${nom}" → adresse envoyée : "${full}"`);
            }
          } else {
            console.warn(`[carte] "${nom}" ignoré : pas de Latitude/Longitude ET pas d'Adresse exploitable. Colonnes lues sur cette ligne :`, Object.keys(row), row);
          }
        }

        places.push({
          id: row.ID || row.id,
          nom, adresse, ville,
          lat: isNaN(lat) ? null : lat,
          lng: isNaN(lng) ? null : lng,
          type: row.Type || row.type,
          categorie: row.Categorie || row.categorie,
          teste: row.Teste || row.teste || row["Testé"] || row["testé"],
          notes: row.Notes || row.notes,
          source: row.Source || row.source,
          lien: row.Lien || row.lien
        });
      }

      allPlaces = places.filter(p => p.lat && p.lng);
      populateFilter(allPlaces);
      renderMarkers(allPlaces);

      if (allPlaces.length) {
        const bounds = L.latLngBounds(allPlaces.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [30,30] });
      }

      const missing = places.length - allPlaces.length;
      statusEl.textContent = `${allPlaces.length} adresse(s) affichée(s)` + (missing ? ` — ${missing} non localisable(s)` : "");
    },
    error: (err) => {
      statusEl.textContent = "Erreur de chargement du Google Sheet : " + err.message;
    }
  });
}

load();
</script>
</body>
</html>
